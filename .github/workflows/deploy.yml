name: deploy kubernetes

on:
  push:
    branches:
      - main

jobs:
  update_deployment:
    name: update deployment
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          config: example/kind.yaml

      - name: check kubectl version
        run: |
          kubectl version -o yaml --client

      - name: get k8s info
        id: k8s_info
        run: |
          kubectl create namespace test-namespace
          kubectl apply -f example/serviceAccount.yaml
          # The action runs as a Docker container on the bridge network, where
          # 0.0.0.0/127.0.0.1 points at the container itself. Reach the kind API
          # server through the bridge gateway instead.
          DOCKER_GATEWAY=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          if [ -z "$DOCKER_GATEWAY" ]; then
            echo "::error::failed to resolve the docker bridge gateway IP"
            exit 1
          fi
          K8S_SERVER=$(kubectl config view --raw --minify --flatten -o jsonpath='{.clusters[].cluster.server}' | sed -E "s/0\.0\.0\.0|127\.0\.0\.1/${DOCKER_GATEWAY}/")
          echo "K8S_SERVER=${K8S_SERVER}" >> "$GITHUB_OUTPUT"
          echo "K8S_CA_CERT=$(kubectl config view --raw --minify --flatten -o jsonpath='{.clusters[].cluster.certificate-authority-data}')" >> "$GITHUB_OUTPUT"
          echo "K8S_TOKEN=$(kubectl get secret deploy -n test-namespace -o jsonpath='{.data.token}' | base64 -d)" >> "$GITHUB_OUTPUT"

      - name: Create deployment
        uses: ./
        with:
          server: ${{ steps.k8s_info.outputs.K8S_SERVER }}
          ca_cert: ${{ steps.k8s_info.outputs.K8S_CA_CERT }}
          # the bridge gateway IP is not in the kind API server cert SANs
          skip_tls_verify: true
          token: ${{ steps.k8s_info.outputs.K8S_TOKEN }}
          namespace: test-namespace
          templates: example/deployment01.yaml

      - name: Deploy Deployment with Custom Variables
        uses: ./
        env:
          INPUT_APP_NAME: demo
        with:
          server: ${{ steps.k8s_info.outputs.K8S_SERVER }}
          ca_cert: ${{ steps.k8s_info.outputs.K8S_CA_CERT }}
          # the bridge gateway IP is not in the kind API server cert SANs
          skip_tls_verify: true
          token: ${{ steps.k8s_info.outputs.K8S_TOKEN }}
          namespace: test-namespace
          templates: example/deployment02.yaml

      - name: update deployment container image
        uses: ./
        with:
          server: ${{ steps.k8s_info.outputs.K8S_SERVER }}
          ca_cert: ${{ steps.k8s_info.outputs.K8S_CA_CERT }}
          # the bridge gateway IP is not in the kind API server cert SANs
          skip_tls_verify: true
          token: ${{ steps.k8s_info.outputs.K8S_TOKEN }}
          namespace: test-namespace
          deployment: demo
          container: nginx
          image: nginx:1.24.0
          debug: true
